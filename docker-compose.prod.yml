# ==============================================================================
# Production Docker Compose: WorkSpace Multi-Tenant SaaS
# Architecture: Isolated Network Topology with Managed Persistence
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy / Ingress Controller
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: workspace-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge_network

  # ----------------------------------------------------------------------------
  # 2. Next.js Web Frontend
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: workspace-prod-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge_network

  # ----------------------------------------------------------------------------
  # 3. Express API Application
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: workspace-prod-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-workspace_user}:${POSTGRES_PASSWORD:-workspace_pass}@postgres:5432/${POSTGRES_DB:-workspace_prod}?schema=public
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-workspace_session}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-7}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_DIR=/app/uploads
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
      - STORAGE_S3_ACCESS_KEY_ID=${STORAGE_S3_ACCESS_KEY_ID}
      - STORAGE_S3_SECRET_ACCESS_KEY=${STORAGE_S3_SECRET_ACCESS_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge_network
      - internal_network

  # ----------------------------------------------------------------------------
  # 4. BullMQ Background Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: workspace-prod-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-workspace_user}:${POSTGRES_PASSWORD:-workspace_pass}@postgres:5432/${POSTGRES_DB:-workspace_prod}?schema=public
      - REDIS_URL=redis://redis:6379
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_DIR=/app/uploads
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

  # ----------------------------------------------------------------------------
  # 5. PostgreSQL Database (Internal only - not published to host)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: workspace-prod-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-workspace_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-workspace_pass}
      - POSTGRES_DB=${POSTGRES_DB:-workspace_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workspace_user} -d ${POSTGRES_DB:-workspace_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  # ----------------------------------------------------------------------------
  # 6. Redis Queue & Rate Limit Store (Internal only - not published to host)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workspace-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

# ------------------------------------------------------------------------------
# Storage Volumes & Isolated Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  edge_network:
    driver: bridge
  internal_network:
    driver: bridge
    internal: true # Security: isolated network with no outbound internet access
