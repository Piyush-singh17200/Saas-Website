openapi: 3.0.3
info:
  title: WorkSpace Developer API
  description: Multi-tenant SaaS Developer Platform and Webhook delivery API.
  version: 1.0.0
servers:
  - url: https://api.workspace.com/api/v1
    description: Production API Server
  - url: http://localhost:4000/api/v1
    description: Local Development Server

paths:
  /auth/sessions:
    get:
      summary: List active sessions
      description: Returns active authenticated devices and sessions for the caller.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: List of active sessions
    delete:
      summary: Revoke all other sessions
      description: Revokes all sessions belonging to the user except the active calling session.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Revocation count

  /auth/sessions/{sessionId}:
    delete:
      summary: Revoke session
      description: Revokes an individual session by its identifier.
      security:
        - CookieAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked

  /auth/mfa/setup:
    post:
      summary: Initiate TOTP MFA setup
      description: Returns authenticator setup key, QR URI, and backup recovery codes.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: MFA setup payload

  /auth/mfa/enable:
    post:
      summary: Confirm and activate MFA
      description: Verifies 6-digit TOTP code and activates two-factor authentication.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: MFA enabled

  /auth/mfa/disable:
    post:
      summary: Disable MFA
      description: Disables MFA after verifying user's current password.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: MFA disabled

  /auth/mfa/challenge/verify:
    post:
      summary: Complete MFA login challenge
      description: Resolves 5-minute login challenge token with 6-digit TOTP code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Authentication successful, session cookie set

  /auth/mfa/challenge/recovery:
    post:
      summary: Resolve MFA challenge via recovery code
      description: Resolves login challenge with a single-use backup recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, recoveryCode]
              properties:
                challengeToken:
                  type: string
                recoveryCode:
                  type: string
      responses:
        '200':
          description: Authentication successful, recovery code consumed

  /organizations/{organizationId}/security/policy:
    get:
      summary: Retrieve organization security policy
      description: Returns MFA requirement and session duration limits for the organization.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Security policy metadata
    patch:
      summary: Update organization security policy
      description: Modifies MFA enforcement or session timeout. Requires OWNER or ADMIN role.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requireMfa:
                  type: boolean
                sessionMaxAgeMinutes:
                  type: integer
      responses:
        '200':
          description: Updated security policy

  /organizations/{organizationId}/security/audit-logs:
    get:
      summary: List security audit logs
      description: Returns immutable, sanitized audit records for the organization. Restricted to OWNER and ADMIN.
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [SUCCESS, FAILURE]
      responses:
        '200':
          description: Paginated audit log records

  /organization:
    get:
      summary: Retrieve caller organization
      description: Returns metadata for the organization bound to the provided API key or session.
      security:
        - ApiKeyAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Organization metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      summary: List projects
      description: Returns a paginated list of projects belonging to the caller's organization.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED]
      responses:
        '200':
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create project
      description: Creates a new project in the caller's organization.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '201':
          description: Project created successfully
        '400':
          $ref: '#/components/responses/ValidationError'

  /projects/{projectId}:
    get:
      summary: Get project details
      security:
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update project
      security:
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInput'
      responses:
        '200':
          description: Project updated

    delete:
      summary: Archive project
      security:
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project archived

  /projects/{projectId}/tasks:
    get:
      summary: List tasks in project
      security:
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE]
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, URGENT]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated tasks list

    post:
      summary: Create task in project
      security:
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Task created

  /tasks/{taskId}:
    get:
      summary: Get task details
      security:
        - ApiKeyAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update task
      security:
        - ApiKeyAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Task updated

    delete:
      summary: Delete task
      security:
        - ApiKeyAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task deleted

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Bearer token format `wsp_live_{prefix}_{secret}`
    CookieAuth:
      type: apiKey
      in: cookie
      name: workspace_session

  schemas:
    OrganizationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    CreateProjectInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    UpdateProjectInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    CreateTaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        status:
          type: string
          enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE]
        dueDate:
          type: string
          format: date-time

    UpdateTaskInput:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
        title:
          type: string
        description:
          type: string
        priority:
          type: string
        status:
          type: string
        dueDate:
          type: string
          format: date-time

    PaginatedProjects:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string

  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Invalid, expired, or revoked API key

    Forbidden:
      description: Insufficient scope or cross-tenant access violation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: FORBIDDEN
                  message:
                    type: string
                    example: Insufficient API key scope

    NotFound:
      description: Resource not found in this organization

    ValidationError:
      description: Invalid payload or parameters
