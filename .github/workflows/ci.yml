name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workspace_user
          POSTGRES_PASSWORD: workspace_pass
          POSTGRES_DB: workspace_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://workspace_user:workspace_pass@localhost:5432/workspace_test?schema=public
      TEST_DATABASE_URL: postgresql://workspace_user:workspace_pass@localhost:5432/workspace_test?schema=public
      TEST_APP_DATABASE_URL: postgresql://workspace_app:workspace_app_pass@localhost:5432/workspace_test?schema=public
      ENFORCE_RLS_RUNTIME: "true"
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.10.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: workspace_pass
        run: |
          psql -h localhost -U workspace_user -d workspace_dev -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE workspace_test;'

      - name: Create application role (pre-migration)
        env:
          PGPASSWORD: workspace_pass
        run: |
          psql -h localhost -U workspace_user -d workspace_test -v ON_ERROR_STOP=1 \
            -v app_user=workspace_app \
            -v app_password=workspace_app_pass \
            -v db_name=workspace_test \
            -f scripts/provision-app-role.sql

      - name: Validate and Apply Prisma Migrations
        run: pnpm --filter @workspace/database exec prisma migrate deploy

      - name: Grant runtime role access to migrated objects
        env:
          PGPASSWORD: workspace_pass
        run: |
          psql -h localhost -U workspace_user -d workspace_test -v ON_ERROR_STOP=1 \
            -v app_user=workspace_app \
            -v app_password=workspace_app_pass \
            -v db_name=workspace_test \
            -f scripts/provision-app-role.sql

      - name: Validate code formatting
        run: pnpm format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Run TypeScript type checks
        run: pnpm typecheck

      - name: Execute Security & Cryptographic Verifications
        run: pnpm --filter @workspace/api test src/__tests__/crypto-and-security-unit.test.ts src/__tests__/security-and-reliability-verification.test.ts src/__tests__/performance-benchmarks.test.ts

      - name: Execute automated test suite
        run: pnpm test

      - name: Build applications & packages
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm --filter @workspace/web exec playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        run: pnpm --filter @workspace/web test:e2e

  build-docker-images:
    name: Build & Validate Docker Images
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.api
          push: false
          tags: workspace-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Database Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.api
          target: migrator
          push: false
          tags: workspace-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.worker
          push: false
          tags: workspace-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.web
          push: false
          tags: workspace-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
